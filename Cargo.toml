[package]
name = "Qllama"
version = "0.1.0"
edition = "2021"
authors = ["Qllama Team"]
description = "A Rust-native LLM inference engine inspired by llama.cpp"
license = "MIT"
repository = "https://github.com/TianMingXTU/Qllama"
keywords = ["llm", "inference", "transformer", "gguf"]
categories = ["science", "algorithms"]

[lib]
name = "qllama"
path = "src/lib.rs"

[[bin]]
name = "qllama"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
required-features = ["bench"]

[[example]]
name = "profile_decode"
required-features = ["profile"]

[features]
bench = []
profile = ["bench"]

[dependencies]
# 并行计算
rayon = "1.10"

# 内存映射
memmap2 = "0.9"

# CLI
clap = { version = "4.5", features = ["derive"] }

# 错误处理
anyhow = "1.0"

# 随机采样（Sampler 的可播种随机源）
rand = "0.8"

[dev-dependencies]
# examples/ 的 JSON 输入输出
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
