# Qllama 本地/单机部署（回环，不对外暴露）。
# 默认绑定 127.0.0.1，仅本机访问；生产经反向代理终止 TLS，示例见
# docs/tls-reverse-proxy-examples.md。审计日志卷可写，模型目录只读。

services:
  qllama:
    image: qllama:rc
    build:
      context: .
      dockerfile: Dockerfile
    # 不暴露到公网；仅宿主机回环可达。
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # 模型目录只读，避免容器内改动权重。
      - ./models:/models:ro
      # 审计日志需要可写；挂宿主机目录，与容器 qllama 用户 (uid 1001) 对齐。
      - qllama-audit:/var/log/qllama
    # 内存上限；按模型与 kv_budget_mib 调整。
    mem_limit: 8g
    mem_reservation: 4g
    # 只读根文件系统；/tmp 用 tmpfs，审计卷单独可写。
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    # 带鉴权的日志轮换上限，避免无限增长。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # 健康检查与 Dockerfile HEALTHCHECK 二选一即可，这里用 compose 级。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    command:
      - "qllama-server"
      - "--models-dir"
      - "/models"
      - "--model"
      - "/models/model.gguf"
      - "--listen"
      - "127.0.0.1:8080"
      - "--kv-block-size"
      - "32"
      - "--cont-batching"
      - "--audit-log"
      - "/var/log/qllama/audit.jsonl"
      # 如需多 API key，可挂载 /models/api_keys.txt 后取消下一行注释；
      # 该文件缺失时务必保持注释，避免容器启动失败。
      # - "--api-key-file"
      # - "/models/api_keys.txt"

volumes:
  qllama-audit:
